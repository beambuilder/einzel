name: CI

# Linux is not an afterthought here. Architecture invariant 1 says nothing may
# reference Einzel.Wpf and every assembly above it must build and run on Linux,
# and Einzel.Render must produce a publication figure headlessly with no display
# attached. An invariant that is only checked on a developer's Windows box is an
# invariant that has already been broken.
#
# Einzel.Render.Tests is that check, no longer "eventually": it draws real device
# templates as SVG and PDF on the Linux runner, where there is no display, no
# window manager, and no font server.

on:
  push:
    branches: [main, esibd]
  pull_request:
    branches: [main, esibd]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Pinned to majors that run on node24. GitHub deprecated the node20 action
      # runtime, and an action on it warns on every job - which is the kind of
      # warning that trains people to ignore the warnings, on a project whose
      # build treats them as errors everywhere else.
      #
      # Check the runtime rather than the version number when bumping these:
      # `gh api repos/actions/checkout/contents/action.yml?ref=<tag> --jq .content
      # | base64 -d | grep -A2 '^runs:'`. A major bump is not the same thing as a
      # runtime bump, and neither implies the other.
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
